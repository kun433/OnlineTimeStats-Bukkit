#   {player} {time} {days} {hours} {minutes} {seconds} {session} {afk}
#   {first_join} {last_join} {last_quit} {sessions} {rank} {total_players}
#   {online} {total_time} {total_hours} {average} {limit} {delta} {before} {input}
