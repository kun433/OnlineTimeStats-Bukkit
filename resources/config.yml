# OnlineTimeStats 配置文件
#
# 按 tick 累计每位玩家的在线时间并长期保存，同时用记分板把时长显示出来。
# 每项配置都有中文注释；改完执行 /playtime reload 即可生效（部分项需重启服务器）。
#
# 注意：YAML 里以 & 开头的值必须带引号，例如 "&a[小时]"，否则会被当成锚点。

# ---------------- 计时方式 ----------------
counting:
  # TICK：每个服务器 tick 记 1 tick。
  #       服务器掉帧（TPS < 20）时会比真实时间少记一点。
  # WALL：每真实 1 秒记 20 tick。
  #       服务器掉帧时也不会少记，但不再是“按服务器 tick 计”。
  mode: TICK
  # 停服/卸载插件时，是否把在线玩家此刻的时长计入并写盘
  count-on-shutdown: true

# ---------------- 数据与保存 ----------------
storage:
  # 数据文件，相对 plugins/OnlineTimeStats/ 目录；也可写绝对路径。
  # 格式：UTF-8 制表符分隔文本，一行一名玩家，可直接查看或用脚本处理。
  file: data/playtime.tsv
  # 自动写盘间隔（秒）。越短越不怕崩溃，但写盘越频繁。
  save-interval-seconds: 120
  # 玩家退出时额外补一次写盘（3 秒内的多次退出会合并成一次写）
  save-on-quit: true

# ---------------- 挂机判定 ----------------
# 默认关闭；打开后长时间不操作的玩家不再累计时长。
afk:
  enabled: false
  # 多少秒没有任何操作（移动/聊天/指令/交互/丢弃物品/潜行）算作挂机
  threshold-seconds: 300
  # true：挂机期间不计入总时长（单独记在挂机时长里）
  # false：照常计入总时长，只额外记录挂机了多少
  exclude-from-total: true
  # 进入/离开挂机时在聊天栏提示玩家
  notify: true

# ---------------- 记分板 ----------------
# 记分板目标与显示位置（等价的指令形式）：
#   scoreboard objectives add playtime dummy
#   scoreboard objectives setdisplay belowName playtime
#   scoreboard objectives setdisplay list playtime
scoreboard:
  enabled: true
  # 目标名称（记分板 objective 名）
  objective: playtime
  # 显示名，例如 "&a[小时]" 或 "&a[分钟]"
  display-name: "&a[小时]"
  # 分数单位：HOURS / MINUTES / SECONDS
  # 注意 1.13 以下的记分板分数只支持整数，所以小时数会直接截断小数。
  unit: HOURS
  # 显示位置，可多选：below_name（玩家名字下方）、list（Tab 列表）、sidebar（右侧栏）
  # 注意：CraftBukkit/Spigot 的记分板 API 限制“一个目标只能占一个显示位置”，
  # 所以第一个位置使用上面的 objective 名，其余位置会自动创建数值完全一致的
  # 镜像目标（如 playtime_list），让同一个数值同时显示在多个位置。
  display-slots:
    - below_name
    - list
  # 每多少秒刷新一次记分板；单位不是 HOURS 时建议调成 1
  update-seconds: 5
  # 额外创建五个细粒度目标：ots_tick（tick%20）/ ots_seconds（秒%60）/
  # ots_minutes（分%60）/ ots_hours（总小时）/ ots_total（总分钟），
  # 方便命令方块或其它插件直接读取。默认关闭，避免污染记分板。
  extra-objectives: false

# ---------------- 其它 ----------------
options:
  # 玩家进服时在聊天栏显示自己的累计时长
  join-quit-message: false
  # 查询时显示“本次在线”时长
  show-session: true

# ---------------- 消息 ----------------
