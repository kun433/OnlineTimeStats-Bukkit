  prefix: "&8[&a在线时间&8] &r"
  no-permission: "&c你没有权限执行这个操作。"
  usage-player: "&7用法: &f/playtime [玩家] &8| &f/playtime top [数量] &8| &f/playtime help"
  player-not-found: "&c找不到玩家 &f{player} &c的记录。"
